<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Thais Souza - Nova Vida TI (Produção)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-dark: #050505;
      --accent: #facc15;
      --accent-glow: rgba(250, 204, 21, 0.4);
      --glass: rgba(15, 15, 18, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --bot-bubble: rgba(255, 255, 255, 0.04);
      --user-bubble: #facc15;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      /* Padrão de pontos modernos */
      background-image:
        radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.035) 1px, transparent 0);
      background-size: 32px 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Overlay de gradiente para dar profundidade */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, rgba(250, 204, 21, 0.05), transparent 40%),
        radial-gradient(circle at bottom left, rgba(250, 204, 21, 0.02), transparent 40%);
      pointer-events: none;
    }

    #app-root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-shell {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Header Estilo Telegram Sleek */
    .chat-header {
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar-container {
      position: relative;
      width: 48px;
      height: 48px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .online-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #22c55e;
      border-radius: 50%;
      border: 2px solid #111;
    }

    .user-details .user-name {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .user-details .user-status {
      font-size: 12px;
      color: #22c55e;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      color: var(--text-dim);
    }

    .header-actions svg {
      cursor: pointer;
      transition: color 0.2s;
    }

    .header-actions svg:hover {
      color: var(--accent);
    }

    /* Body de Mensagens */
    .chat-body {
      flex: 1;
      padding: 25px 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: none;
    }

    .chat-body::-webkit-scrollbar {
      display: none;
    }

    .nv-row {
      display: flex;
      width: 100%;
      margin-bottom: 5px;
    }

    .nv-row.incoming {
      justify-content: flex-start;
    }

    .nv-row.outgoing {
      justify-content: flex-end;
    }

    .nv-bubble {
      max-width: 75%;
      padding: 14px 18px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
      transition: transform 0.2s;
      backdrop-filter: blur(10px);
    }

    .incoming .nv-bubble {
      background: var(--bot-bubble);
      color: #fff;
      border-radius: 20px 20px 20px 5px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .outgoing .nv-bubble {
      background: var(--accent);
      color: #000;
      border-radius: 20px 20px 5px 20px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.2);
    }

    .bubble-time {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.6;
    }

    .tick-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
    }

    .tick-blue {
      color: #34b7f1;
    }

    .tick-grey {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Typing Indicator Dark */
    .typing-indicator .nv-bubble {
      background: var(--bot-bubble);
      padding: 12px 20px;
      border-radius: 20px;
      display: flex;
      gap: 5px;
      width: fit-content;
    }

    .dot-typing {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.4;
      animation: dotPulse 1.5s infinite;
    }

    .dot-typing:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot-typing:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.4;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* Footer Estilo iOS/Telegram */
    .chat-footer {
      padding: 20px 30px 35px 30px;
      background: transparent;
    }

    .footer-form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 8px 15px;
      gap: 12px;
    }

    .input-reset {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      padding: 10px 0;
      outline: none;
    }

    .icon-btn {
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }

    .icon-btn:hover {
      color: var(--accent);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #000;
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);
      transition: transform 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    /* Button de Seleção Multiple */
    .chat-choice-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-choice-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
      text-align: left;
    }

    .chat-choice-btn:hover {
      background: rgba(250, 204, 21, 0.1);
      border-color: var(--accent);
    }

    .chat-choice-selected {
      background: var(--accent) !important;
      color: #000 !important;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 14px;
    }

    .action-btn {
      background: #25d366;
      color: #fff;
      padding: 15px;
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      font-weight: 700;
    }

    /* Estilo Responsivo Mobile (WhatsApp Style) */
    @media (max-width: 768px) {
      #app-root {
        padding: 0;
        /* Remove a margem externa no mobile */
      }

      .chat-shell {
        height: 100vh;
        /* Ocupa a altura total do navegador */
        max-width: 100%;
        border-radius: 0;
        /* Bordas retas como um app nativo */
        border: none;
      }

      .chat-header {
        padding: 15px 20px;
      }

      .chat-body {
        padding: 15px 20px;
      }

      .chat-footer {
        padding: 15px 20px 25px 20px;
        /* Ajuste para navegação mobile */
      }

      .nv-bubble {
        max-width: 85%;
        /* Um pouco mais de espaço para o texto no celular */
      }
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PDMRZ5ZL" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="app-root">
    <main class="chat-shell">
      <header class="chat-header">
        <div class="profile-info">
          <div class="avatar-container">
            <img src="https://i.ibb.co/1GrBp8Y4/Captura-de-tela-2026-04-09-152750.png" class="avatar-img" />
            <div class="online-indicator"></div>
          </div>
          <div class="user-details">
            <div class="user-name">Thais Souza - Nova Vida TI</div>
            <div class="user-status">online</div>
          </div>
        </div>
        <div class="header-actions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1" />
            <circle cx="12" cy="5" r="1" />
            <circle cx="12" cy="19" r="1" />
          </svg>
        </div>
      </header>

      <div class="chat-body" id="chatBody"></div>

      <footer class="chat-footer">
        <form id="chatForm" class="footer-form">
          <div class="icon-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M8 14s1.5 2 4 2 4-2 4-2" />
              <line x1="9" y1="9" x2="9.01" y2="9" />
              <line x1="15" y1="9" x2="15.01" y2="9" />
            </svg>
          </div>
          <div class="icon-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.51a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </div>
          <input type="text" id="chatInput" placeholder="Mensagem" autocomplete="off" class="input-reset" />
          <button type="submit" class="send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 14-7-7 14-2-7-5-2Z" />
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>
  <script>
    const CONFIG = {
      API_URL: 'https://chatnv-production.up.railway.app',
      WHATSAPP_NUMBER: '5511986913505'
    };

    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const getTime = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    let messageHistory = [
      {
        role: "system",
        content: `Você é a Thais, assistente da Nova Vida TI. Seu objetivo é pré-qualificar leads, identificar perfil, coletar dados e direcionar para o WhatsApp. NÃO venda.

🧠 COMPORTAMENTO: Direta, profissional, mensagens curtas. NUNCA faça mais de uma pergunta por vez. Se o usuário fugir do contexto, diga: "Boa tentativa 😄 mas vou manter o foco pra te direcionar da melhor forma."

💬 FLUIDEZ: Sempre que for enviar mais de um parágrafo ou uma resposta longa, use quebras de linha duplas para que eu envie em bolhas separadas.

🚀 FLUXO:
1. NOME: "Pra gente começar, qual seu nome?"
2. FILTRO: "Perfeito, {{nome}}. 👉 Sua empresa utiliza dados ou base de clientes na operação?"
🚫 DESCARTE (se não tiver empresa ou quiser empréstimo): "Perfeito, então talvez não faça sentido agora. Nossas soluções são focadas apenas em empresas com operação e uso de dados 👍" [LEAD_DESQUALIFICADO]
3. DOR: "Qual principal problema hoje com seus dados ou base?"
4. VOLUME: Responda EXATAMENTE: "Entendi, isso costuma impactar bastante mesmo. Hoje, qual o tamanho aproximado da sua base? [BOTOES_VOLUME]"
5. NOME EMPRESA: "Qual o nome da sua empresa?"
6. CNPJ: "Perfeito. Pra te direcionar com mais precisão, me informa o CNPJ da empresa?"
🔎 VALIDAÇÃO: Aceite com ou sem pontos/traços/barras. O requisito é ter exatamente 14 dígitos numéricos no total. Se inválido: "CNPJ inválido ou incompleto, pode conferir pra mim?"

✅ SUCESSO: "Perfeito, {{nome}}, já identifiquei sua empresa 👍\n\nVou te conectar com nosso time agora. Quando abrir a conversa, já vai aparecer uma mensagem automática com alguns dados seus, isso ajuda nosso time a entender seu cenário mais rápido, então pode enviar ela direto, ok?\n\nA partir daí eles continuam com você 🙂"
Sempre finalize a conversa gerando OBRIGATORIAMENTE o bloco abaixo, sem nenhum texto antes dele:
[WHATSAPP_DATA]
Nome: {{nome}}
Empresa: {{empresa}}
CNPJ: {{cnpj}}
Base: {{volume}}
Problema: {{dor}}
[/WHATSAPP_DATA]`
      },
      {
        role: "assistant",
        content: "Oi! 👋 Sou a Thais, da Nova Vida TI.<br><br>Aqui na Nova Vida TI, ajudamos empresas a melhorar resultados usando dados (crédito, cobrança e marketing).<br><br>Antes de começarmos, só pra alinhar rápido: Nós NÃO somos banco e não oferecemos empréstimos.<br><br>Pra te direcionar da melhor forma, posso te fazer algumas perguntas rápidas?"
      }
    ];

    function addMessage(html, type = 'incoming') {
      const row = document.createElement('div');
      row.className = `nv-row ${type}`;
      const bubble = document.createElement('div');
      bubble.className = 'nv-bubble';

      const tickSvg = type === 'outgoing'
        ? '<svg class="tick-icon tick-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l5 5L22 4"/><path d="M7 12l5 5L15 14"/></svg>'
        : '<svg class="tick-icon tick-grey" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l5 5L22 4"/><path d="M7 12l5 5L15 14"/></svg>';

      bubble.innerHTML = html + `<div class="bubble-time">${getTime()} ${tickSvg}</div>`;
      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'nv-row incoming typing-indicator';
      row.innerHTML = '<div class="nv-bubble"><div class="dot-typing"></div><div class="dot-typing"></div><div class="dot-typing"></div></div>';
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return row;
    }

    async function renderBotMessages(text) {
      if (!text) return;
      // Splitta por <br><br> ou por quebras de linha duplas verdadeiras \n\n
      const chunks = text.split(/<br><br>|\n\n/).filter(t => t.trim() !== '');
      for (let chunk of chunks) {
        const t = showTyping();
        // Tempo de digitação proporcional ao tamanho do texto (mínimo 1s, máximo 3s)
        const typingTime = Math.min(Math.max(chunk.length * 30, 1000), 3000);
        await new Promise(r => setTimeout(r, typingTime));
        t.remove();
        addMessage(chunk.trim().replace(/\n/g, '<br>'), 'incoming');
      }
    }

    async function processAIResponse() {
      try {
        const response = await fetch(`${CONFIG.API_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messageHistory })
        });
        const data = await response.json();
        let botText = data.choices[0].message.content;
        messageHistory.push({ role: 'assistant', content: botText });

        let waLink = null;

        if (botText.includes('[LEAD_DESQUALIFICADO]')) {
          window.dataLayer?.push({ 'event': 'chat_lead_desqualificado' });
          botText = botText.replace('[LEAD_DESQUALIFICADO]', '');
        }

        if (botText.includes('[WHATSAPP_DATA]')) {
          window.dataLayer?.push({ 'event': 'chat_lead_qualificado' });
          const match = botText.match(/\[WHATSAPP_DATA\]([\s\S]*?)\[\/WHATSAPP_DATA\]/);
          if (match) {
            const waLinkParams = match[1].trim();
            waLink = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(waLinkParams)}`;
            botText = botText.replace(match[0], '');
          }
        }

        if (botText.includes('[BOTOES_VOLUME]')) {
          const buttons = `<div class="chat-choice-container"><button class="chat-choice-btn" onclick="sendChoice('Até 10 mil contatos', this)">Até 10 mil contatos</button><button class="chat-choice-btn" onclick="sendChoice('Entre 50 mil e 100 mil', this)">Entre 50 mil e 100 mil</button><button class="chat-choice-btn" onclick="sendChoice('Acima de 100 mil', this)">Acima de 100 mil</button></div>`;
          botText = botText.replace('[BOTOES_VOLUME]', buttons);
        }

        // Renderiza as mensagens de texto primeiro
        await renderBotMessages(botText);

        // Somente após o texto, exibe o botão se o lead for qualificado
        if (waLink) {
          const t = showTyping();
          await new Promise(r => setTimeout(r, 1500));
          t.remove();
          addMessage(`<p>Vou te conectar agora.</p><a href="${waLink}" target="_blank" class="action-btn" onclick="window.dataLayer.push({'event': 'chat_whatsapp_click'})">Falar com Especialista</a>`, 'incoming');
        }
      } catch (e) {
        addMessage("❌ Sua internet está instável, por favor, verifique sua conexão e tente novamente.", "incoming");
      }
    }

    function sendChoice(choice, btn) {
      const parent = btn.parentElement;
      parent.innerHTML = `<div class="chat-choice-selected">${choice}</div>`;
      addMessage(choice, 'outgoing');
      messageHistory.push({ role: 'user', content: choice });
      processAIResponse();
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      addMessage(text, 'outgoing');
      messageHistory.push({ role: 'user', content: text });
      processAIResponse();
    });

    window.onload = () => {
      renderBotMessages(messageHistory[1].content);
    };
  </script>
</body>

</html>
