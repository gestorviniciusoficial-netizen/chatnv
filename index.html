<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Vida TI - Chat Embed</title>
  <style>
    /* Este código garante que o chat ocupe o espaço correto no Great Pages sem erros */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
    }

    .container {
      width: 100%;
      height: 800px;
      /* Ajuste a altura conforme desejar no Great Pages */
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- O CHAT HOSPEDADO NO VERCEL -->
    <iframe src="https://project-947sj.vercel.app/" title="Assistente Nova Vida TI" allow="clipboard-write"
      scrolling="no">
    </iframe>
  </div>
</body>

</html>
